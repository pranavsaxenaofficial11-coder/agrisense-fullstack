<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AgriSense — Prototype 3D Model</title>
<style>
  html,body{margin:0;height:100%;background:#12301F;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
  #hud{position:fixed;top:14px;left:16px;color:#EAF3E2;z-index:5}
  #hud h1{font-size:20px;margin:0 0 4px}
  #hud p{font-size:12.5px;margin:0;color:#9FBF8C}
  #tag{position:fixed;bottom:12px;right:16px;color:#7E9A7C;font-size:11px}
</style>
</head>
<body>
<div id="hud"><h1>🌱 AgriSense — Prototype (3D)</h1><p>Drag to rotate · scroll to zoom · auto-spins when idle</p></div>
<div id="tag">Team AgriSense · ESP32 smart-farm prototype</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12301F);
scene.fog = new THREE.Fog(0x12301F, 40, 90);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, .55));
const sun = new THREE.DirectionalLight(0xfff4e0, .9);
sun.position.set(14, 22, 10); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-25; sun.shadow.camera.right=25; sun.shadow.camera.top=25; sun.shadow.camera.bottom=-25;
scene.add(sun);

// ground
const ground = new THREE.Mesh(new THREE.CircleGeometry(60,48), new THREE.MeshStandardMaterial({color:0x1A3D22, roughness:1}));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.6; ground.receiveShadow = true;
scene.add(ground);

function box(w,h,d,color,x,y,z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color, roughness:.6, metalness:.08}));
  m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; scene.add(m); return m;
}
function labelSprite(text, x, y, z, scale=3.4){
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(255,255,255,0.94)'; g.strokeStyle = '#97BC62'; g.lineWidth = 6;
  const w = g.measureText(text).width;
  g.beginPath(); g.roundRect ? g.roundRect(8,14,496,100,50) : g.rect(8,14,496,100); g.fill(); g.stroke();
  g.fillStyle = '#1F4B20'; g.font = 'bold 56px Arial'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(text, 256, 66);
  const t = new THREE.CanvasTexture(c);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:t, depthTest:false}));
  s.scale.set(scale, scale/4, 1); s.position.set(x,y,z); scene.add(s); return s;
}

// ---- breadboard ----
const board = box(18, 0.8, 12, 0xEADFC8, 0, 0, 0);
box(17.4, 0.35, 0.5, 0xC0392B, 0, 0.55, -5.4);   // + rail
box(17.4, 0.35, 0.5, 0x2E5AA0, 0, 0.55, 5.4);    // - rail
// hole strips hint
for(let i=-4;i<=4;i++) box(16.6, 0.06, 0.08, 0xC9BC9E, 0, 0.44, i*1.1);

// ---- components ----
box(4.6, 0.9, 2.4, 0x1F4B20, -5.6, 0.85, -2.6); labelSprite('ESP32', -5.6, 2.6, -2.6);
for(let i=0;i<6;i++) box(0.14,0.18,0.14, 0xD8C766, -7.4+i*0.75, 1.35, -3.7);
box(1.4, 1.0, 1.1, 0x3B82C4, -0.6, 0.9, -3.4);  labelSprite('DHT11', -0.6, 2.5, -3.4, 2.8);
box(0.5, 1.5, 2.6, 0x8A5A2B, 3.4, 1.15, -2.6);
box(0.5, 1.5, 2.6, 0xA06A33, 4.4, 1.15, -2.6);  labelSprite('Soil ×2', 3.9, 3.0, -2.6, 2.8);
box(1.2, 0.6, 0.9, 0xE3B23C, -0.7, 0.7, -0.9);  labelSprite('LDR', -0.7, 1.9, -0.9, 2.2);
box(1.9, 0.3, 1.3, 0x2FA3A0, 1.7, 0.55, 0.4);   labelSprite('Rain', 1.7, 1.6, 0.4, 2.2);
const us = box(3.6, 1.1, 1.0, 0xC8CDD2, -5.4, 0.95, 1.6); labelSprite('HC-SR04', -5.4, 2.7, 1.6, 2.9);
[[-6.3],[ -4.5]].forEach(([ex])=>{ const eye = new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.3,20), new THREE.MeshStandardMaterial({color:0x2B2F33})); eye.rotation.x=Math.PI/2; eye.position.set(ex,0.95,2.15); scene.add(eye); });
box(3.0, 0.85, 1.9, 0xB23A3A, -0.4, 0.85, 2.8); labelSprite('Relay ×2', -0.4, 2.5, 2.8, 2.9);
const pump = new THREE.Mesh(new THREE.CylinderGeometry(0.85,0.85,1.9,24), new THREE.MeshStandardMaterial({color:0x6E7880, roughness:.5, metalness:.2}));
pump.position.set(3.6, 1.4, 1.6); pump.castShadow = true; scene.add(pump); labelSprite('Pump', 3.6, 3.1, 1.6, 2.2);
const fanBase = box(2.3, 0.5, 2.3, 0x44505A, 5.6, 0.65, 3.6);
const fanGroup = new THREE.Group(); fanGroup.position.set(5.6, 1.05, 3.6);
for(let a=0;a<5;a++){ const bl = new THREE.Mesh(new THREE.BoxGeometry(0.95,0.06,0.4), new THREE.MeshStandardMaterial({color:0x93A3B0})); bl.position.set(Math.cos(a*1.257)*0.55,0,Math.sin(a*1.257)*0.55); bl.rotation.y = -a*1.257; fanGroup.add(bl); }
scene.add(fanGroup); labelSprite('Fan', 5.6, 2.5, 3.6, 2.0);
box(2.2, 1.1, 1.3, 0x2C6E49, -2.6, 0.95, 4.4);  labelSprite('Li battery', -2.6, 2.6, 4.4, 2.9);

// ---- wires ----
function wire(from, to, color, lift=2.2){
  const mid = new THREE.Vector3((from.x+to.x)/2, Math.max(from.y,to.y)+lift, (from.z+to.z)/2);
  const curve = new THREE.QuadraticBezierCurve3(from, mid, to);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 24, 0.055, 8), new THREE.MeshStandardMaterial({color}));
  tube.castShadow = true; scene.add(tube);
}
const espTop = new THREE.Vector3(-5.0, 1.3, -2.6);
wire(espTop, new THREE.Vector3(-0.6, 1.4, -3.4), 0x639922, 1.6);
wire(espTop, new THREE.Vector3(3.4, 1.9, -2.6), 0xE3B23C, 2.4);
wire(espTop, new THREE.Vector3(4.4, 1.9, -2.6), 0xE3B23C, 2.8);
wire(espTop, new THREE.Vector3(-0.7, 1.0, -0.9), 0xD85A30, 1.7);
wire(espTop, new THREE.Vector3(1.7, 0.7, 0.4), 0x2E5AA0, 2.2);
wire(espTop, new THREE.Vector3(-5.4, 1.5, 1.6), 0x2B2F33, 1.5);
wire(espTop, new THREE.Vector3(-0.4, 1.3, 2.8), 0xB23A3A, 2.6);

// ---- camera + custom orbit ----
let theta = 0.85, phi = 1.05, radius = 26, auto = true, lastTouch = 0;
function setCam(){
  camera.position.set(radius*Math.sin(phi)*Math.cos(theta), radius*Math.cos(phi), radius*Math.sin(phi)*Math.sin(theta));
  camera.lookAt(0, 0.6, 0);
}
setCam();
let dragging=false, px=0, py=0;
addEventListener('pointerdown', e=>{dragging=true;px=e.clientX;py=e.clientY;auto=false;lastTouch=Date.now();});
addEventListener('pointerup', ()=>dragging=false);
addEventListener('pointermove', e=>{
  if(!dragging) return;
  theta += (e.clientX-px)*0.006; phi -= (e.clientY-py)*0.005;
  phi = Math.min(1.45, Math.max(0.35, phi));
  px=e.clientX; py=e.clientY; lastTouch=Date.now(); setCam();
});
addEventListener('wheel', e=>{ radius = Math.min(50, Math.max(12, radius + e.deltaY*0.02)); lastTouch=Date.now(); auto=false; setCam(); });
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

(function animate(){
  requestAnimationFrame(animate);
  if(!auto && Date.now()-lastTouch > 4000) auto = true;
  if(auto){ theta += 0.0035; setCam(); }
  fanGroup.rotation.y += 0.18;
  renderer.render(scene, camera);
})();
</script>
</body>
</html>

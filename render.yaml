# ==============================================================================
# Render.com Blueprint Infrastructure Specification
# ==============================================================================
services:
  # AgriSense Backend API
  - type: web
    name: agrisense-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "https://agrisense-269.pages.dev,https://agrisense.app,http://localhost:5173"
      - key: SQLITE_DB_PATH
        value: "./agrisense.db"
    healthCheckPath: /health

  # AgriSense Static Web App
  - type: web
    name: agrisense-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
